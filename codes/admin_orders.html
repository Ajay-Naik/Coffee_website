<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management - Sunset Cafe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="icon" href="../images/main/coffee_logo.png">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 100px auto;
            padding: 20px;
        }
        .admin-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .admin-header h1 {
            color: #621c20;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .orders-table th {
            background-color: #621c20;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        .orders-table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        .orders-table tr:hover {
            background-color: #f5f5f5;
        }
        .order-status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-completed {
            background-color: #d4edda;
            color: #155724;
        }
        .view-details {
            color: #f3961c;
            cursor: pointer;
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-size: 16px;
            color: #666;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .pagination {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .pagination button {
            padding: 8px 12px;
            background-color: #621c20;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .pagination button:hover {
            background-color: #f3961c;
        }
        .pagination button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: black;
        }
        .order-item {
            background-color: #f9f9f9;
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #f3961c;
        }
        .order-item strong {
            color: #621c20;
        }
    </style>
</head>
<body>
    <!-- Header & Navbar Section -->
    <header>
        <nav>
            <div class="nav_logo">
                <a href="index.html">
                    <img src="../images/main/coffee_logo.png" alt="Coffee Logo" />
                    <h2>Sunset Cafe</h2>
                </a>
            </div>
            <input type="checkbox" id="click" />
            <label for="click">
                <i class="menu_btn bx bx-menu"></i>
                <i class="close_btn bx bx-x"></i>
            </label>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="admin_orders.html" class="active">Orders</a></li>
                <li><a href="index.html">Back to Site</a></li>
            </ul>
        </nav>
    </header>

    <div class="admin-container">
        <div class="admin-header">
            <h1>📋 Order Management</h1>
            <p>View and manage all customer orders</p>
        </div>

        <div id="errorMsg" class="error" style="display: none;"></div>

        <div id="loading" class="loading">Loading orders...</div>

        <table class="orders-table" id="ordersTable" style="display: none;">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer Name</th>
                    <th>Payment Method</th>
                    <th>Order Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody">
            </tbody>
        </table>

        <div class="pagination">
            <button id="prevBtn" onclick="previousPage()">← Previous</button>
            <span id="pageInfo"></span>
            <button id="nextBtn" onclick="nextPage()">Next →</button>
        </div>
    </div>

    <!-- Modal for Order Details -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Order Details</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer>
        <div class="section_container">
            <div class="footer_section">
                <div class="footer_logo">
                    <a href="index.html">
                        <img src="../images/main/coffee_logo.png" alt="Coffee Logo" />
                        <h2>Sunset Cafe</h2>
                    </a>
                </div>
                <div class="useful_links">
                    <h3>Quick Links</h3>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="menu.html">Menu</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <script>
        let currentOffset = 0;
        const itemsPerPage = 10;

        function loadOrders() {
            const loading = document.getElementById('loading');
            const table = document.getElementById('ordersTable');
            const errorMsg = document.getElementById('errorMsg');

            loading.style.display = 'block';
            table.style.display = 'none';
            errorMsg.style.display = 'none';

            fetch(`fetch_orders.php?limit=${itemsPerPage}&offset=${currentOffset}`)
                .then(response => response.json())
                .then(data => {
                    loading.style.display = 'none';

                    if (!data.success) {
                        errorMsg.textContent = 'Error: ' + (data.message || 'Failed to load orders');
                        errorMsg.style.display = 'block';
                        return;
                    }

                    const tbody = document.getElementById('ordersTableBody');
                    tbody.innerHTML = '';

                    if (data.orders.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px;">No orders found</td></tr>';
                        table.style.display = 'table';
                        return;
                    }

                    data.orders.forEach(order => {
                        const date = new Date(order.created_at).toLocaleDateString('en-IN');
                        const row = `<tr>
                            <td>#${order.id}</td>
                            <td>${order.full_name}</td>
                            <td>${order.payment_method}</td>
                            <td>${date}</td>
                            <td><span class="view-details" onclick="viewOrderDetails(${order.id})">View</span></td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });

                    table.style.display = 'table';
                    updatePagination(data.total);
                })
                .catch(error => {
                    loading.style.display = 'none';
                    errorMsg.textContent = 'Error loading orders: ' + error.message;
                    errorMsg.style.display = 'block';
                    console.error('Error:', error);
                });
        }

        function viewOrderDetails(orderId) {
            const modal = document.getElementById('orderModal');
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '<p>Loading...</p>';
            modal.style.display = 'block';

            fetch(`fetch_orders.php?id=${orderId}`)
                .then(response => response.json())
                .then(data => {
                    if (!data.success) {
                        modalBody.innerHTML = '<p style="color: red;">Error: ' + (data.message || 'Failed to load order') + '</p>';
                        return;
                    }

                    const order = data.order;
                    const date = new Date(order.created_at).toLocaleDateString('en-IN');
                    const time = new Date(order.created_at).toLocaleTimeString('en-IN');

                    let itemsHtml = order.items.map(item => `
                        <div class="order-item">
                            <strong>${item.item_name}</strong><br>
                            Price: ₹${item.item_price} × ${item.item_quantity} = ₹${(item.item_price * item.item_quantity).toFixed(2)}
                        </div>
                    `).join('');

                    const html = `
                        <p><strong>Order ID:</strong> #${order.id}</p>
                        <p><strong>Date & Time:</strong> ${date} ${time}</p>
                        <p><strong>Customer:</strong> ${order.full_name}</p>
                        <p><strong>Email:</strong> ${order.email || 'N/A'}</p>
                        <p><strong>Address:</strong> ${order.address}</p>
                        <p><strong>City:</strong> ${order.city}</p>
                        <p><strong>Zip Code:</strong> ${order.zip_code}</p>
                        <p><strong>Payment Method:</strong> ${order.payment_method}</p>
                        <hr>
                        <h3>Items Ordered</h3>
                        ${itemsHtml}
                        <hr>
                        <p><strong>Total:</strong> <span style="font-size: 18px; color: #f3961c;">₹${order.total.toFixed(2)}</span></p>
                    `;
                    modalBody.innerHTML = html;
                })
                .catch(error => {
                    modalBody.innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
                    console.error('Error:', error);
                });
        }

        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function updatePagination(totalOrders) {
            const totalPages = Math.ceil(totalOrders / itemsPerPage);
            const currentPage = Math.floor(currentOffset / itemsPerPage) + 1;

            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentOffset === 0;
            document.getElementById('nextBtn').disabled = currentOffset + itemsPerPage >= totalOrders;
        }

        function previousPage() {
            if (currentOffset > 0) {
                currentOffset -= itemsPerPage;
                loadOrders();
            }
        }

        function nextPage() {
            currentOffset += itemsPerPage;
            loadOrders();
        }

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('orderModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Load orders on page load
        loadOrders();
    </script>
</body>
</html>
